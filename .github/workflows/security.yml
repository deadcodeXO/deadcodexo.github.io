name: Security

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit (prod deps)
        run: npm audit --omit=dev

      - name: Build
        run: npm run build
