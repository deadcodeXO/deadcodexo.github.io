<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DCs Dev Editor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #12141a;
        --panel: #1b1f2b;
        --panel-2: #232838;
        --text: #dde7ff;
        --muted: #90a0c4;
        --accent: #66a2ff;
        --success: #4bc37a;
        --danger: #f26975;
        --border: rgba(128, 154, 212, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(1200px 700px at 88% -10%, rgba(102, 162, 255, 0.16), transparent 45%),
          radial-gradient(900px 600px at -10% 110%, rgba(59, 121, 226, 0.14), transparent 50%),
          var(--bg);
        color: var(--text);
        font-family: "Segoe UI Variable Text", "Inter", "Segoe UI", sans-serif;
      }

      .titlebar {
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px 0 12px;
        border-bottom: 1px solid var(--border);
        background: rgba(19, 23, 32, 0.92);
        -webkit-app-region: drag;
        position: relative;
        z-index: 20;
      }

      .titlebar-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .title-meta {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 99px;
        background: var(--success);
        box-shadow: 0 0 0 3px rgba(75, 195, 122, 0.2);
      }

      .title {
        font-size: 12px;
        letter-spacing: 0.03em;
        color: #cbd8f8;
      }

      .window-controls {
        display: flex;
        gap: 4px;
        -webkit-app-region: no-drag;
      }

      .window-controls,
      .window-controls * {
        -webkit-app-region: no-drag;
        pointer-events: auto;
      }

      .window-controls button {
        width: 28px;
        height: 22px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: #b9c8eb;
        cursor: pointer;
        display: grid;
        place-items: center;
        padding: 0;
        -webkit-app-region: no-drag;
      }

      .window-controls button:hover {
        border-color: var(--border);
        background: rgba(140, 169, 230, 0.12);
      }

      .window-controls button.close:hover {
        color: #fff;
        border-color: rgba(255, 80, 100, 0.45);
        background: rgba(255, 80, 100, 0.4);
      }

      .window-controls button svg {
        width: 12px;
        height: 12px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
      }

      .app-shell {
        height: calc(100% - 34px);
        display: block;
      }

      .workspace {
        display: grid;
        grid-template-rows: 42px minmax(0, 1fr) auto;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      .workspace-header {
        border-bottom: 1px solid var(--border);
        background: rgba(18, 22, 32, 0.72);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
      }

      .workspace-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .workspace-header h1 {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.02em;
        color: #ccdaf8;
      }

      .workspace-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .workspace-action-btn {
        width: 24px;
        height: 24px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: #b8c8ec;
        display: grid;
        place-items: center;
        padding: 0;
        cursor: pointer;
      }

      .workspace-action-btn:hover {
        border-color: var(--border);
        background: rgba(140, 169, 230, 0.16);
        color: #d8e5ff;
      }

      .workspace-action-btn svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
      }

      .workspace-action-btn.busy {
        border-color: rgba(115, 167, 255, 0.72);
        box-shadow: 0 0 0 2px rgba(115, 167, 255, 0.18);
        color: #d7e5ff;
      }

      .build-status {
        font-size: 12px;
        color: var(--muted);
      }

      .workspace-main {
        display: grid;
        grid-template-columns: var(--code-pane-width, 470px) 8px minmax(0, 1fr);
        min-height: 0;
        overflow: hidden;
      }

      .code-pane {
        min-width: 0;
        border-right: 1px solid var(--border);
        background: rgba(20, 24, 35, 0.82);
        display: grid;
        grid-template-rows: 34px minmax(0, 1fr) 26px;
        overflow: hidden;
      }

      .code-pane-head {
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 8px 0 10px;
        background: rgba(16, 20, 30, 0.9);
      }

      .code-pane-title {
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #a9bce4;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .code-pane-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .code-pane-btn {
        width: 22px;
        height: 22px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: #9cb2de;
        padding: 0;
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      .code-pane-btn:hover {
        border-color: var(--border);
        background: rgba(140, 169, 230, 0.16);
        color: #d8e5ff;
      }

      .code-pane-btn svg {
        width: 13px;
        height: 13px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
      }

      .code-pane-body {
        min-height: 0;
        display: grid;
        grid-template-columns: 230px minmax(0, 1fr);
      }

      .file-pane {
        min-width: 0;
        min-height: 0;
        border-right: 1px solid var(--border);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        background: rgba(15, 19, 28, 0.7);
        overflow: hidden;
      }

      .file-filter-wrap {
        padding: 8px 8px 6px;
      }

      .file-filter {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: rgba(18, 24, 36, 0.82);
        color: var(--text);
        font-size: 12px;
        padding: 7px 9px;
        outline: none;
      }

      .file-filter:focus {
        border-color: rgba(112, 165, 255, 0.86);
        box-shadow: 0 0 0 2px rgba(102, 162, 255, 0.22);
      }

      .file-list {
        height: 100%;
        min-height: 0;
        overflow-y: scroll;
        overflow-x: hidden;
        scrollbar-gutter: stable both-edges;
        padding: 4px 4px 8px 6px;
        scrollbar-width: auto;
        scrollbar-color: rgba(120, 152, 214, 0.55) transparent;
      }

      .file-list::-webkit-scrollbar {
        width: 12px;
      }

      .file-list::-webkit-scrollbar-track {
        background: transparent;
      }

      .file-list::-webkit-scrollbar-thumb {
        background: linear-gradient(
          180deg,
          rgba(116, 154, 232, 0.7),
          rgba(91, 131, 214, 0.55)
        );
        border: 3px solid transparent;
        border-radius: 10px;
        background-clip: padding-box;
      }

      .file-item {
        width: 100%;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: #b7c7ea;
        text-align: left;
        font-size: 12px;
        line-height: 1.35;
        padding: 6px 8px;
        margin-bottom: 2px;
        cursor: pointer;
      }

      .file-item.dir {
        display: flex;
        align-items: center;
        gap: 4px;
        font-weight: 600;
      }

      .file-tree-toggle {
        width: 10px;
        flex: 0 0 10px;
        color: #a5b9e2;
        font-size: 11px;
      }

      .file-tree-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .file-item:hover {
        border-color: rgba(130, 168, 244, 0.5);
        background: rgba(108, 150, 236, 0.13);
        color: #e0ebff;
      }

      .file-item.active {
        border-color: rgba(117, 167, 255, 0.85);
        background: rgba(102, 162, 255, 0.2);
        color: #f0f5ff;
      }

      .file-item.dirty::before {
        content: "* ";
        color: #f9be69;
      }

      .file-empty {
        font-size: 12px;
        color: var(--muted);
        padding: 8px;
      }

      .code-view {
        min-width: 0;
        min-height: 0;
        position: relative;
        display: grid;
        grid-template-rows: 30px minmax(0, 1fr);
      }

      .code-view-head {
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        font-size: 12px;
        color: #afc2ea;
        background: rgba(15, 19, 28, 0.82);
      }

      .code-file-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .monaco-host {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      .plain-editor {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        outline: none;
        resize: none;
        background: #0f1420;
        color: #dbe6ff;
        padding: 12px;
        font-family: Consolas, "Cascadia Code", monospace;
        font-size: 13px;
        line-height: 1.45;
        tab-size: 2;
      }

      .plain-editor.hidden {
        display: none;
      }

      .editor-empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 12px;
        padding: 18px;
        text-align: center;
        pointer-events: none;
        z-index: 2;
      }

      .editor-empty.hidden {
        display: none;
      }

      .code-pane-foot {
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0 10px;
        font-size: 11px;
        color: var(--muted);
        background: rgba(15, 19, 28, 0.82);
      }

      .workspace-resizer {
        cursor: col-resize;
        background: rgba(72, 103, 163, 0.3);
        transition: background 0.12s ease;
      }

      .workspace-resizer:hover,
      .workspace-resizer.dragging {
        background: rgba(102, 162, 255, 0.62);
      }

      .editor-frame {
        width: 100%;
        height: 100%;
        border: none;
        background: #0e1219;
      }

      body[data-theme="light"] {
        --bg: #e8edf6;
        --panel: #f7faff;
        --panel-2: #eef3ff;
        --text: #1f2a3f;
        --muted: #5c6d90;
        --border: rgba(100, 130, 184, 0.26);
      }

      body[data-theme="light"] .titlebar {
        background: rgba(246, 249, 255, 0.95);
      }

      body[data-theme="light"] .workspace-header {
        background: rgba(238, 244, 255, 0.88);
      }

      body[data-theme="light"] .workspace-main {
        background: rgba(245, 249, 255, 0.75);
      }

      body[data-theme="light"] .code-pane {
        background: rgba(243, 248, 255, 0.94);
      }

      body[data-theme="light"] .code-pane-head,
      body[data-theme="light"] .code-view-head,
      body[data-theme="light"] .code-pane-foot {
        background: rgba(235, 242, 255, 0.94);
      }

      body[data-theme="light"] .file-pane {
        background: rgba(238, 244, 255, 0.88);
      }

      body[data-theme="light"] .file-filter {
        background: rgba(248, 251, 255, 0.98);
        color: #1f2a3f;
      }

      body[data-theme="light"] .file-list {
        scrollbar-color: rgba(136, 154, 186, 0.72) transparent;
      }

      body[data-theme="light"] .file-list::-webkit-scrollbar-thumb {
        background: linear-gradient(
          180deg,
          rgba(198, 209, 228, 0.95),
          rgba(172, 186, 211, 0.9)
        );
        background-clip: padding-box;
      }

      body[data-theme="light"] .file-item {
        color: #345079;
      }

      body[data-theme="light"] .file-item:hover {
        color: #1c365c;
        background: rgba(167, 189, 224, 0.34);
      }

      body[data-theme="light"] .file-item.active {
        color: #1b365a;
        background: rgba(145, 176, 224, 0.42);
      }

      body[data-theme="light"] .file-tree-toggle {
        color: #6f86b1;
      }

      body[data-theme="light"] .plain-editor {
        background: #f7faff;
        color: #1b2d4a;
      }

      body[data-theme="light"] .console {
        background: rgba(239, 245, 255, 0.95);
      }

      body[data-theme="light"] .console-body {
        color: #27416f;
      }

      body[data-theme="light"] .editor-frame {
        background: #ffffff;
      }

      body[data-theme="light"] .title {
        color: #2f4363;
      }

      body[data-theme="light"] .workspace-action-btn {
        color: #51678f;
      }

      body[data-theme="light"] .workspace-action-btn:hover {
        color: #2c446a;
        background: rgba(168, 190, 226, 0.25);
      }

      .console {
        border-top: 1px solid var(--border);
        background: rgba(9, 12, 18, 0.92);
        height: 170px;
        display: grid;
        grid-template-rows: 34px 1fr;
        position: relative;
        z-index: 5;
      }

      .console.minimized {
        height: 34px;
        grid-template-rows: 34px 0;
      }

      .console-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
      }

      .console-head strong {
        font-size: 12px;
        color: #c7d5f6;
      }

      .console-actions {
        display: flex;
        gap: 8px;
      }

      .console-actions button {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        padding: 4px 8px;
        font-size: 11px;
        cursor: pointer;
      }

      .console-actions button:hover {
        color: var(--text);
        border-color: rgba(130, 168, 244, 0.65);
      }

      .console-body {
        margin: 0;
        padding: 10px 12px 12px;
        overflow: auto;
        scrollbar-width: auto;
        scrollbar-color: rgba(120, 152, 214, 0.55) transparent;
        font-family: Consolas, "Cascadia Code", monospace;
        font-size: 12px;
        line-height: 1.38;
        color: #bfd7ff;
        white-space: pre-wrap;
      }

      .console-body::-webkit-scrollbar {
        width: 13px;
        height: 13px;
      }

      .console-body::-webkit-scrollbar-track {
        background: transparent;
      }

      .console-body::-webkit-scrollbar-thumb {
        background: linear-gradient(
          180deg,
          rgba(116, 154, 232, 0.7),
          rgba(91, 131, 214, 0.55)
        );
        border: 3px solid transparent;
        border-radius: 11px;
        background-clip: padding-box;
      }

      .console-body::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(
          180deg,
          rgba(132, 172, 255, 0.8),
          rgba(98, 142, 230, 0.72)
        );
        background-clip: padding-box;
      }

      body[data-theme="light"] .console-body {
        scrollbar-color: rgba(136, 154, 186, 0.72) transparent;
      }

      body[data-theme="light"] .console-body::-webkit-scrollbar-thumb {
        background: linear-gradient(
          180deg,
          rgba(198, 209, 228, 0.95),
          rgba(172, 186, 211, 0.9)
        );
        background-clip: padding-box;
      }

      body[data-theme="light"] .console-body::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(
          180deg,
          rgba(208, 220, 238, 0.98),
          rgba(185, 199, 224, 0.96)
        );
        background-clip: padding-box;
      }
    </style>
  </head>
  <body>
    <header class="titlebar">
      <div class="titlebar-left">
        <div class="title-meta">
          <span class="status-dot" id="status-dot"></span>
          <span class="title">DCs Dev Editor</span>
        </div>
      </div>
      <div class="window-controls">
        <button id="min-btn" type="button" aria-label="Minimize">
          <svg viewBox="0 0 16 16" aria-hidden="true"><line x1="3" y1="8" x2="13" y2="8"></line></svg>
        </button>
        <button id="max-btn" type="button" aria-label="Maximize">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1"></rect></svg>
        </button>
        <button id="close-btn" class="close" type="button" aria-label="Close">
          <svg viewBox="0 0 16 16" aria-hidden="true"><line x1="4" y1="4" x2="12" y2="12"></line><line x1="12" y1="4" x2="4" y2="12"></line></svg>
        </button>
      </div>
    </header>

    <main class="app-shell">
      <section class="workspace">
        <div class="workspace-header">
          <div class="workspace-left">
            <h1>Tools</h1>
            <div class="workspace-actions">
              <button class="workspace-action-btn" id="reload-shell-btn" type="button" aria-label="Reload workspace" title="Reload workspace">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 12a9 9 0 0 1 15.5-6.4L21 8"></path>
                  <path d="M21 3v5h-5"></path>
                  <path d="M21 12a9 9 0 0 1-15.5 6.4L3 16"></path>
                  <path d="M3 21v-5h5"></path>
                </svg>
              </button>
              <button class="workspace-action-btn" id="open-site-btn" type="button" aria-label="Open site in browser" title="Open site">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M14 3h7v7"></path>
                  <path d="M10 14 21 3"></path>
                  <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"></path>
                </svg>
              </button>
              <button class="workspace-action-btn" id="build-btn" type="button" aria-label="Build site" title="Build">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m14 11 6 6"></path>
                  <path d="m13 13-8.8 8.8a2.1 2.1 0 0 1-3-3L10 10"></path>
                  <path d="m16 16 6-6"></path>
                  <path d="m9 7 8 8"></path>
                  <path d="m21 11-8-8"></path>
                </svg>
              </button>
              <button class="workspace-action-btn" id="toggle-console-btn" type="button" aria-label="Toggle logs panel" title="Logs">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <polyline points="4 17 10 11 4 5"></polyline>
                  <line x1="12" y1="19" x2="20" y2="19"></line>
                </svg>
              </button>
            </div>
          </div>
          <span class="build-status" id="build-status">Ready</span>
        </div>
        <div class="workspace-main" id="workspace-main">
          <section class="code-pane" id="code-pane">
            <div class="code-pane-head">
              <span class="code-pane-title" id="repo-label">Repository</span>
              <div class="code-pane-actions">
                <button class="code-pane-btn" id="refresh-files-btn" type="button" aria-label="Refresh file list" title="Refresh files">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 12a9 9 0 0 1 15.5-6.4L21 8"></path>
                    <path d="M21 3v5h-5"></path>
                    <path d="M21 12a9 9 0 0 1-15.5 6.4L3 16"></path>
                    <path d="M3 21v-5h5"></path>
                  </svg>
                </button>
                <button class="code-pane-btn" id="save-file-btn" type="button" aria-label="Save current file" title="Save file">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path>
                    <polyline points="17 21 17 13 7 13 7 21"></polyline>
                    <polyline points="7 3 7 8 15 8"></polyline>
                  </svg>
                </button>
              </div>
            </div>
            <div class="code-pane-body">
              <aside class="file-pane">
                <div class="file-filter-wrap">
                  <input
                    id="file-filter-input"
                    class="file-filter"
                    type="text"
                    placeholder="Filter files..."
                    autocomplete="off"
                  />
                </div>
                <div class="file-list" id="file-list"></div>
              </aside>
              <section class="code-view">
                <div class="code-view-head">
                  <span class="code-file-name" id="current-file-label">No file selected</span>
                </div>
                <div class="monaco-host" id="monaco-host">
                  <div class="editor-empty" id="editor-empty">
                    Select a file to edit. Your changes stay local to this repository.
                  </div>
                  <textarea
                    id="plain-editor"
                    class="plain-editor hidden"
                    spellcheck="false"
                    aria-label="Fallback code editor"
                  ></textarea>
                </div>
              </section>
            </div>
            <div class="code-pane-foot">
              <span id="editor-status">Editor ready</span>
            </div>
          </section>
          <div class="workspace-resizer" id="workspace-resizer" aria-hidden="true"></div>
          <iframe id="editor-frame" class="editor-frame" title="Editor"></iframe>
        </div>
        <section class="console" id="console">
          <div class="console-head">
            <strong>Activity</strong>
            <div class="console-actions">
              <button id="clear-console-btn" type="button">Clear</button>
            </div>
          </div>
          <pre class="console-body" id="console-body"></pre>
        </section>
      </section>
    </main>

    <script src="./shell.js"></script>
  </body>
</html>
