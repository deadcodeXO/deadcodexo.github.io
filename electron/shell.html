<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DCs Dev Editor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #12141a;
        --panel: #1b1f2b;
        --panel-2: #232838;
        --text: #dde7ff;
        --muted: #90a0c4;
        --accent: #66a2ff;
        --success: #4bc37a;
        --danger: #f26975;
        --border: rgba(128, 154, 212, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(1200px 700px at 88% -10%, rgba(102, 162, 255, 0.16), transparent 45%),
          radial-gradient(900px 600px at -10% 110%, rgba(59, 121, 226, 0.14), transparent 50%),
          var(--bg);
        color: var(--text);
        font-family: "Segoe UI Variable Text", "Inter", "Segoe UI", sans-serif;
      }

      .titlebar {
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px 0 12px;
        border-bottom: 1px solid var(--border);
        background: rgba(19, 23, 32, 0.92);
        -webkit-app-region: drag;
        position: relative;
        z-index: 20;
      }

      .titlebar-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .title-meta {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 99px;
        background: var(--success);
        box-shadow: 0 0 0 3px rgba(75, 195, 122, 0.2);
      }

      .title {
        font-size: 12px;
        letter-spacing: 0.03em;
        color: #cbd8f8;
      }

      .window-controls {
        display: flex;
        gap: 4px;
        -webkit-app-region: no-drag;
      }

      .window-controls,
      .window-controls * {
        -webkit-app-region: no-drag;
        pointer-events: auto;
      }

      .window-controls button {
        width: 28px;
        height: 22px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: #b9c8eb;
        cursor: pointer;
        display: grid;
        place-items: center;
        padding: 0;
        -webkit-app-region: no-drag;
      }

      .window-controls button:hover {
        border-color: var(--border);
        background: rgba(140, 169, 230, 0.12);
      }

      .window-controls button.close:hover {
        color: #fff;
        border-color: rgba(255, 80, 100, 0.45);
        background: rgba(255, 80, 100, 0.4);
      }

      .window-controls button svg {
        width: 12px;
        height: 12px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
      }

      .app-shell {
        height: calc(100% - 34px);
        display: block;
      }

      .workspace {
        display: grid;
        grid-template-rows: 42px minmax(0, 1fr) auto;
        height: 100%;
        min-width: 0;
        min-height: 0;
      }

      .workspace-header {
        border-bottom: 1px solid var(--border);
        background: rgba(18, 22, 32, 0.72);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
      }

      .workspace-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .workspace-header h1 {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.02em;
        color: #ccdaf8;
      }

      .workspace-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .workspace-action-btn {
        width: 24px;
        height: 24px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: #b8c8ec;
        display: grid;
        place-items: center;
        padding: 0;
        cursor: pointer;
      }

      .workspace-action-btn:hover {
        border-color: var(--border);
        background: rgba(140, 169, 230, 0.16);
        color: #d8e5ff;
      }

      .workspace-action-btn svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
      }

      .workspace-action-btn.busy {
        border-color: rgba(115, 167, 255, 0.72);
        box-shadow: 0 0 0 2px rgba(115, 167, 255, 0.18);
        color: #d7e5ff;
      }

      .build-status {
        font-size: 12px;
        color: var(--muted);
      }

      .editor-frame {
        width: 100%;
        height: 100%;
        border: none;
        background: #0e1219;
      }

      body[data-theme="light"] {
        --bg: #e8edf6;
        --panel: #f7faff;
        --panel-2: #eef3ff;
        --text: #1f2a3f;
        --muted: #5c6d90;
        --border: rgba(100, 130, 184, 0.26);
      }

      body[data-theme="light"] .titlebar {
        background: rgba(246, 249, 255, 0.95);
      }

      body[data-theme="light"] .workspace-header {
        background: rgba(238, 244, 255, 0.88);
      }

      body[data-theme="light"] .console {
        background: rgba(239, 245, 255, 0.95);
      }

      body[data-theme="light"] .console-body {
        color: #27416f;
      }

      body[data-theme="light"] .editor-frame {
        background: #ffffff;
      }

      body[data-theme="light"] .title {
        color: #2f4363;
      }

      body[data-theme="light"] .workspace-action-btn {
        color: #51678f;
      }

      body[data-theme="light"] .workspace-action-btn:hover {
        color: #2c446a;
        background: rgba(168, 190, 226, 0.25);
      }

      .console {
        border-top: 1px solid var(--border);
        background: rgba(9, 12, 18, 0.92);
        height: 170px;
        display: grid;
        grid-template-rows: 34px 1fr;
      }

      .console.minimized {
        height: 34px;
        grid-template-rows: 34px 0;
      }

      .console-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
      }

      .console-head strong {
        font-size: 12px;
        color: #c7d5f6;
      }

      .console-actions {
        display: flex;
        gap: 8px;
      }

      .console-actions button {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        padding: 4px 8px;
        font-size: 11px;
        cursor: pointer;
      }

      .console-actions button:hover {
        color: var(--text);
        border-color: rgba(130, 168, 244, 0.65);
      }

      .console-body {
        margin: 0;
        padding: 10px 12px 12px;
        overflow: auto;
        scrollbar-width: auto;
        scrollbar-color: rgba(120, 152, 214, 0.55) transparent;
        font-family: Consolas, "Cascadia Code", monospace;
        font-size: 12px;
        line-height: 1.38;
        color: #bfd7ff;
        white-space: pre-wrap;
      }

      .console-body::-webkit-scrollbar {
        width: 13px;
        height: 13px;
      }

      .console-body::-webkit-scrollbar-track {
        background: transparent;
      }

      .console-body::-webkit-scrollbar-thumb {
        background: linear-gradient(
          180deg,
          rgba(116, 154, 232, 0.7),
          rgba(91, 131, 214, 0.55)
        );
        border: 3px solid transparent;
        border-radius: 11px;
        background-clip: padding-box;
      }

      .console-body::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(
          180deg,
          rgba(132, 172, 255, 0.8),
          rgba(98, 142, 230, 0.72)
        );
        background-clip: padding-box;
      }

      body[data-theme="light"] .console-body {
        scrollbar-color: rgba(136, 154, 186, 0.72) transparent;
      }

      body[data-theme="light"] .console-body::-webkit-scrollbar-thumb {
        background: linear-gradient(
          180deg,
          rgba(198, 209, 228, 0.95),
          rgba(172, 186, 211, 0.9)
        );
        background-clip: padding-box;
      }

      body[data-theme="light"] .console-body::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(
          180deg,
          rgba(208, 220, 238, 0.98),
          rgba(185, 199, 224, 0.96)
        );
        background-clip: padding-box;
      }
    </style>
  </head>
  <body>
    <header class="titlebar">
      <div class="titlebar-left">
        <div class="title-meta">
          <span class="status-dot" id="status-dot"></span>
          <span class="title">DCs Dev Editor</span>
        </div>
      </div>
      <div class="window-controls">
        <button id="min-btn" type="button" aria-label="Minimize">
          <svg viewBox="0 0 16 16" aria-hidden="true"><line x1="3" y1="8" x2="13" y2="8"></line></svg>
        </button>
        <button id="max-btn" type="button" aria-label="Maximize">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1"></rect></svg>
        </button>
        <button id="close-btn" class="close" type="button" aria-label="Close">
          <svg viewBox="0 0 16 16" aria-hidden="true"><line x1="4" y1="4" x2="12" y2="12"></line><line x1="12" y1="4" x2="4" y2="12"></line></svg>
        </button>
      </div>
    </header>

    <main class="app-shell">
      <section class="workspace">
        <div class="workspace-header">
          <div class="workspace-left">
            <h1>Tools</h1>
            <div class="workspace-actions">
              <button class="workspace-action-btn" id="reload-shell-btn" type="button" aria-label="Reload workspace" title="Reload workspace">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 12a9 9 0 0 1 15.5-6.4L21 8"></path>
                  <path d="M21 3v5h-5"></path>
                  <path d="M21 12a9 9 0 0 1-15.5 6.4L3 16"></path>
                  <path d="M3 21v-5h5"></path>
                </svg>
              </button>
              <button class="workspace-action-btn" id="open-site-btn" type="button" aria-label="Open site in browser" title="Open site">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M14 3h7v7"></path>
                  <path d="M10 14 21 3"></path>
                  <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"></path>
                </svg>
              </button>
              <button class="workspace-action-btn" id="build-btn" type="button" aria-label="Build site" title="Build">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m14 11 6 6"></path>
                  <path d="m13 13-8.8 8.8a2.1 2.1 0 0 1-3-3L10 10"></path>
                  <path d="m16 16 6-6"></path>
                  <path d="m9 7 8 8"></path>
                  <path d="m21 11-8-8"></path>
                </svg>
              </button>
              <button class="workspace-action-btn" id="toggle-console-btn" type="button" aria-label="Toggle logs panel" title="Logs">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <polyline points="4 17 10 11 4 5"></polyline>
                  <line x1="12" y1="19" x2="20" y2="19"></line>
                </svg>
              </button>
            </div>
          </div>
          <span class="build-status" id="build-status">Ready</span>
        </div>
        <iframe id="editor-frame" class="editor-frame" title="Editor"></iframe>
        <section class="console" id="console">
          <div class="console-head">
            <strong>Activity</strong>
            <div class="console-actions">
              <button id="clear-console-btn" type="button">Clear</button>
            </div>
          </div>
          <pre class="console-body" id="console-body"></pre>
        </section>
      </section>
    </main>

    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const editorUrl =
          params.get("editorUrl") || "http://127.0.0.1:4321/editor";
        const siteUrl = params.get("siteUrl") || "http://127.0.0.1:4321";

        const api = window.electronAPI;
        const frame = document.getElementById("editor-frame");
        const buildBtn = document.getElementById("build-btn");
        const buildStatus = document.getElementById("build-status");
        const consoleBody = document.getElementById("console-body");
        const consoleEl = document.getElementById("console");
        const statusDot = document.getElementById("status-dot");
        const editorOrigin = (() => {
          try {
            return new URL(editorUrl).origin;
          } catch {
            return null;
          }
        })();
        const siteOrigin = (() => {
          try {
            return new URL(siteUrl).origin;
          } catch {
            return null;
          }
        })();
        const messageOrigin = editorOrigin ?? siteOrigin ?? "*";
        let frameThemeObserver = null;
        let observedThemeDocument = null;

        if (frame) frame.src = editorUrl;

        const log = message => {
          if (!consoleBody) return;
          const stamp = new Date().toLocaleTimeString();
          consoleBody.textContent += `[${stamp}] ${message}\n`;
          consoleBody.scrollTop = consoleBody.scrollHeight;
        };

        const setBusy = busy => {
          if (buildBtn) buildBtn.classList.toggle("busy", busy);
          if (statusDot) {
            statusDot.style.background = busy ? "#66a2ff" : "#4bc37a";
            statusDot.style.boxShadow = busy
              ? "0 0 0 3px rgba(102, 162, 255, 0.2)"
              : "0 0 0 3px rgba(75, 195, 122, 0.2)";
          }
        };

        const setStatus = text => {
          if (buildStatus) buildStatus.textContent = text;
        };

        const reloadFrame = () => {
          if (!frame) return;
          frame.src = editorUrl;
          log("Editor refreshed.");
        };

        const applyShellTheme = theme => {
          const normalizedTheme = theme === "light" ? "light" : "dark";
          document.body.setAttribute("data-theme", normalizedTheme);
        };

        const requestThemeFromEditor = () => {
          if (!frame || !frame.contentWindow) return;
          frame.contentWindow.postMessage(
            { type: "companion-request-theme" },
            messageOrigin
          );
        };

        const readThemeFromFrame = () => {
          if (!frame) return null;
          try {
            const doc = frame.contentDocument;
            const themeAttr = doc?.documentElement?.getAttribute("data-theme");
            if (themeAttr === "light" || themeAttr === "dark") return themeAttr;
            const stored = frame.contentWindow?.localStorage?.getItem("theme");
            if (stored === "light" || stored === "dark") return stored;
          } catch {
            return null;
          }
          return null;
        };

        const syncThemeFromFrame = () => {
          const frameTheme = readThemeFromFrame();
          if (!frameTheme) return;
          applyShellTheme(frameTheme);
        };

        const bindFrameThemeObserver = () => {
          if (!frame) return;
          let frameDoc = null;
          try {
            frameDoc = frame.contentDocument;
          } catch {
            return;
          }
          if (!frameDoc || frameDoc === observedThemeDocument) return;
          observedThemeDocument = frameDoc;

          if (frameThemeObserver) {
            frameThemeObserver.disconnect();
            frameThemeObserver = null;
          }

          const root = frameDoc.documentElement;
          if (!root) return;

          frameThemeObserver = new MutationObserver(() => {
            syncThemeFromFrame();
          });

          frameThemeObserver.observe(root, {
            attributes: true,
            attributeFilter: ["data-theme"],
          });
          syncThemeFromFrame();
        };

        const callWindowControl = fnName => {
          const fn = api && api[fnName];
          if (typeof fn !== "function") {
            log(`Window control unavailable: ${fnName}`);
            return;
          }
          fn().catch(() => {
            log(`Window control failed: ${fnName}`);
          });
        };

        document
          .getElementById("open-site-btn")
          ?.addEventListener("click", () => {
            if (!api?.openExternal) {
              log("Open site unavailable.");
              return;
            }
            api.openExternal(siteUrl).catch(() => {
              log("Failed to open site.");
            });
          });

        document
          .getElementById("toggle-console-btn")
          ?.addEventListener("click", () => {
            if (!consoleEl) return;
            consoleEl.classList.toggle("minimized");
          });

        document
          .getElementById("reload-shell-btn")
          ?.addEventListener("click", () => {
            log("Reloading workspace...");
            window.location.reload();
          });

        document
          .getElementById("clear-console-btn")
          ?.addEventListener("click", () => {
            if (consoleBody) consoleBody.textContent = "";
          });

        const bindWindowControl = (id, fnName) => {
          const el = document.getElementById(id);
          if (!el) return;
          el.addEventListener("pointerdown", event => {
            event.preventDefault();
            event.stopPropagation();
          });
          el.addEventListener("click", event => {
            event.preventDefault();
            event.stopPropagation();
            callWindowControl(fnName);
          });
        };

        bindWindowControl("min-btn", "minimizeWindow");
        bindWindowControl("max-btn", "maximizeWindow");
        bindWindowControl("close-btn", "closeWindow");

        frame?.addEventListener("load", () => {
          requestThemeFromEditor();
          bindFrameThemeObserver();
          syncThemeFromFrame();
        });

        const runBuild = () => {
          if (!api || !buildBtn) return;
          if (buildBtn.classList.contains("busy")) return;

          setBusy(true);
          setStatus("Building...");
          log("Build started.");

          api.runReadyProd().catch(() => {
            setBusy(false);
            setStatus("Build failed");
            log("Build command failed to start.");
          });
        };

        buildBtn?.addEventListener("click", runBuild);

        document.addEventListener("keydown", event => {
          if (!(event.ctrlKey || event.metaKey)) return;
          const key = event.key.toLowerCase();

          if (key === "r") {
            event.preventDefault();
            reloadFrame();
          }

          if (key === "c") {
            event.preventDefault();
            consoleEl?.classList.toggle("minimized");
          }
        });

        document.addEventListener("contextmenu", event => {
          event.preventDefault();
          api?.showContextMenu().catch(() => {});
        });

        window.addEventListener("message", event => {
          if (messageOrigin !== "*" && event.origin !== messageOrigin) return;
          if (frame?.contentWindow && event.source !== frame.contentWindow) return;
          if (event.data?.type !== "editor-theme") return;
          applyShellTheme(event.data.value);
        });

        api?.onRefreshCms(() => {
          reloadFrame();
        });

        api?.onReadyProdEvent(payload => {
          if (!payload) return;
          if (payload.type === "start" || payload.type === "trigger" || payload.type === "busy") {
            setBusy(true);
            setStatus("Building...");
            log(payload.message || "Build running...");
            return;
          }

          if (payload.type === "log") {
            log(payload.message || "");
            return;
          }

          if (payload.type === "success") {
            setBusy(false);
            setStatus("Ready");
            log(payload.message || "Build finished.");
            api.showNotification("Build Complete", "Your site has been built successfully!").catch(() => {});
            return;
          }

          if (payload.type === "failure" || payload.type === "error") {
            setBusy(false);
            setStatus("Build failed");
            log(payload.message || "Build failed.");
            api.showNotification("Build Failed", payload.message || "Build failed").catch(() => {});
          }
        });

        api?.getReadyProdStatus().then(status => {
          if (status?.running) {
            setBusy(true);
            setStatus("Building...");
            log("Build already in progress.");
          } else {
            setBusy(false);
            setStatus("Ready");
          }
        });

        const preferredTheme =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        applyShellTheme(preferredTheme);
        requestThemeFromEditor();

        const themeSyncTimer = window.setInterval(() => {
          bindFrameThemeObserver();
          syncThemeFromFrame();
        }, 1200);

        window.addEventListener("beforeunload", () => {
          window.clearInterval(themeSyncTimer);
          if (frameThemeObserver) frameThemeObserver.disconnect();
        });

        log("Companion shell initialized.");
      })();
    </script>
  </body>
</html>
